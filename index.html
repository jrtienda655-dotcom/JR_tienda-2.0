<!DOCTYPE html>
<html lang="es" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JR_tienda</title>
<meta name="theme-color" content="#fbf9f4">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{--bg:#f4f6f7;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#dde3e8;--brand:#0f3d4a;--brand2:#165b6d;--gold:#e3a72f;--wa:#17a34a;--wa-ink:#fff;--err:#b3261e;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media not all{:root:not([data-theme="light"]){--bg:#0d1419;--card:#16202a;--ink:#eaf0f4;--mute:#9aabb8;--line:#27343f;--brand:#0f3d4a;--brand2:#2a8199;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1419;--card:#16202a;--ink:#eaf0f4;--mute:#9aabb8;--line:#27343f;--brand2:#2a8199;--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.brand b{font-family:Sora,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff}
header.top .in{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.logo{width:42px;height:42px;border-radius:12px;background:var(--gold);color:#1b1405;display:grid;place-items:center;font:800 19px Sora,sans-serif;letter-spacing:-.04em}
.brand b{font-size:20px}
.nav a,.nav button{color:#fff;text-decoration:none;font-weight:500;padding:8px 12px;border-radius:10px;background:none;border:0;cursor:pointer}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.14)}
main{max-width:1100px;margin:auto;padding:20px 16px 90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font-weight:700;cursor:pointer;text-decoration:none;font-size:16px;min-height:48px}
.btn.main{background:var(--gold);color:#1b1405}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--err);color:var(--err)}
.btn.sm{padding:9px 14px;min-height:40px;font-size:14px;border-radius:11px}
.hero{background:linear-gradient(150deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;border-radius:26px;padding:clamp(28px,6vw,64px) clamp(20px,5vw,56px);display:grid;gap:22px;justify-items:start}
.hero .logo{width:72px;height:72px;font-size:32px;border-radius:20px}
.hero h1{font-size:clamp(34px,7vw,60px);line-height:1.05}
.hero p{margin:0;max-width:46ch;font-size:18px;opacity:.92}
.hero .acts{display:grid;gap:12px;width:min(100%,360px)}
.hero small{opacity:.8}
.sec{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 16px;flex-wrap:wrap}
.sec h2{font-size:26px}.sec p{margin:2px 0 0;color:var(--mute)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:1/1;background:var(--line);display:block;width:100%;object-fit:cover;cursor:pointer}
.card .bd{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.price{font:800 21px Sora,sans-serif;color:var(--brand2)}
.sp{color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .btn{margin-top:auto}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:20px;padding:36px 20px;text-align:center;display:grid;gap:14px;justify-items:center}
.detail{display:grid;gap:22px}
@media(min-width:800px){.detail{grid-template-columns:1.1fr 1fr;align-items:start}}
.detail img{width:100%;border-radius:20px;background:var(--line);max-height:640px;object-fit:cover}
.detail h1{font-size:clamp(26px,4vw,38px);line-height:1.15;overflow-wrap:anywhere}
.detail .specs{white-space:pre-wrap;color:var(--mute);overflow-wrap:anywhere}
.stick{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:520px;margin:20px auto;display:grid;gap:14px}
label{font-weight:700;font-size:14px;display:grid;gap:6px}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
textarea{min-height:120px;resize:vertical}
.err{color:var(--err);font-size:14px;font-weight:500;min-height:0}
.hint{color:var(--mute);font-size:14px;margin:0}
.drop{border:2px dashed var(--line);border-radius:16px;min-height:200px;display:grid;place-items:center;text-align:center;padding:12px;cursor:pointer;background:var(--bg);overflow:hidden}
.drop img{width:100%;max-height:340px;object-fit:cover;border-radius:12px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;flex-wrap:wrap}
.row img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--line)}
.row .t{flex:1;min-width:140px;overflow-wrap:anywhere}.row .t b{display:block}
.rows{display:grid;gap:10px}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:20;max-width:92vw;font-weight:500}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:16px}
.modal .panel{margin:0}
.bn{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;z-index:15;box-shadow:0 10px 30px rgba(0,0,0,.25)}.bn>div{flex:1;line-height:1.3}.bn .logo{flex:none}
footer{text-align:center;color:var(--mute);font-size:14px;padding:10px 16px calc(30px + env(safe-area-inset-bottom,0px))}
footer a{color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}}

:root{--bg:#f7f4f0;--card:#fffaf4;--ink:#1c1714;--mute:#6f655d;--line:#e7dfd6;--brand:#a24a2a;--brand2:#a24a2a;--gold:#a24a2a;--wa:#2f9e55;color-scheme:light}
body{font:500 16px/1.55 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,.bt b,.price{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.02em}
header.top{background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
header.top .in{padding:14px 16px 10px;gap:12px}
.logo{background:#14100d;color:#fff;border-radius:12px;width:42px;height:42px;font:600 17px Fraunces,Georgia,serif;letter-spacing:0}
.brand{gap:12px}.bt{display:grid;line-height:1.15}.bt b{font-size:23px}.bt small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600}
.chat{width:54px;height:42px;border-radius:999px;background:var(--brand);color:#fff;display:grid;place-items:center}.chat svg{width:20px;height:20px}
.nav{order:3;width:100%;display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav a,.nav button{color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 18px;white-space:nowrap;font:500 16px Manrope,sans-serif;text-decoration:none;cursor:pointer}
.nav a:hover,.nav button:hover{background:var(--line)}.nav a.on,.nav a.on:hover{background:#14100d;color:#fff;border-color:#14100d}
.nav i{font-style:normal;background:var(--brand);color:#fff;border-radius:99px;padding:1px 7px;margin-left:4px;font-size:13px}
.btn{border-radius:999px;font-weight:600}.btn svg{width:20px;height:20px;flex:none}
.btn.main{background:var(--brand);color:#fff}.btn.dark{background:#14100d;color:#fff}.btn.out{background:transparent;border:1px solid #cfc6bb;color:var(--ink)}.btn.wa{background:var(--wa);color:#fff}
.hero{background:none;color:var(--ink);border-radius:0;padding:26px 0 6px;display:grid;gap:26px;justify-items:start}
.hero h1{font-size:clamp(38px,9vw,68px);line-height:1.08;max-width:15ch}.hero h1 i{color:var(--brand);font-style:italic}
.hero p{color:var(--mute);font-size:18px;opacity:1;max-width:48ch}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:20px;flex-wrap:wrap;color:var(--mute);font-size:15px}.trust span{display:flex;gap:8px;align-items:center}.trust svg{width:20px;height:20px}
.collage{display:grid;gap:10px;width:100%;grid-template-columns:repeat(3,1fr)}.collage.c1{grid-template-columns:1fr}.collage.c2{grid-template-columns:1fr 1fr}
.collage img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:28px;background:var(--line)}.collage.c1 img{aspect-ratio:4/3}
.q{font-size:30px;margin:36px 0 14px}.ct{font-size:34px;margin:22px 0 14px}
.acts{display:grid;gap:14px}
.act{display:flex;align-items:center;gap:16px;padding:22px;border-radius:28px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink)}
.act b{font:600 22px/1.2 Manrope,sans-serif}.act small{display:block;font-size:16px;opacity:.85;font-weight:500}.act svg{width:30px;height:30px;flex:none}
.act.brand{background:var(--brand);border-color:var(--brand);color:#fff}.act.green{background:var(--wa);border-color:var(--wa);color:#fff}
@media(min-width:800px){.acts{grid-template-columns:repeat(3,1fr)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 18px;cursor:pointer;font:500 16px Manrope,sans-serif;color:var(--mute)}
.chip.on{background:#ece6df;border-color:#ece6df;color:var(--ink);font-weight:700}.srt{border-bottom:1px solid var(--line);margin-bottom:22px}.srt .chip{border:0}
.grid{grid-template-columns:repeat(2,1fr);gap:30px 14px}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:36px 20px}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.pi{display:block;position:relative;aspect-ratio:1/1;border-radius:28px;overflow:hidden;background:var(--line)}.pi img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:12px;top:12px;background:#14100d;color:#fff;border-radius:999px;padding:7px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.pt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-top:14px}
.cat{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:700}
.pp{text-align:right;display:grid}.pp b{font-size:18px;font-weight:800}.pp s{color:var(--mute);font-size:14px}
.pc h3{font-size:22px;line-height:1.2;margin:2px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc h3 a{text-decoration:none}
.pa{display:flex;gap:8px}.pa .btn{flex:1;padding:11px 10px;min-height:44px;font-size:14px}.pa .btn.wa{flex:none;width:52px}
.panel,.row{background:var(--card)}.detail img{border-radius:28px}.price{color:var(--brand)}
footer{padding-top:30px}

:root{--bg:#f6f3ec;--card:#fff;--line:#e4ddd0}
html,body{overflow-x:hidden}body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{padding:14px 14px 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fbf9f4;color:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 14px}
header.top .brand{margin-right:auto;gap:12px;min-width:0}
.logo{border:1px solid var(--line)}
.bt b{font:700 20px Manrope,system-ui,sans-serif;letter-spacing:-.01em}
.chat{background:#1d2026;color:#f5f0e6}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs a{flex:1;min-width:0;display:grid;justify-items:center;gap:3px;text-decoration:none;color:#8a847a;font-size:12px;font-weight:600;position:relative;padding:4px 0}
.tabs a svg{width:24px;height:24px}.tabs a.on{color:#1d2026}
.tabs i{position:absolute;top:-2px;left:calc(50% + 6px);background:#1d2026;color:#fff;border-radius:99px;font-style:normal;font-size:11px;padding:1px 6px}
.srch{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:0 14px;margin:2px 0 12px;font-weight:500}
.srch svg{width:20px;height:20px;color:var(--mute);flex:none}
.srch input{border:0;background:transparent;padding:14px 0;width:100%;outline:none;font:500 16px Manrope,sans-serif;border-radius:0}
.chips{margin-bottom:14px}.chip{background:#fff}.chip.on{background:#1d2026;color:#fff;border-color:#1d2026}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pi{border-radius:0}
.pb{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.cat:empty{display:none}
.pc h3{font:600 16px/1.3 Manrope,sans-serif;margin:0;white-space:normal;text-overflow:clip;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.6em;overflow-wrap:anywhere}
.pp{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-align:left}.pp b{font-size:18px;font-weight:800}
.pa{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.bn{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.stick{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.free{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:#e6f4ea;color:#1e7a3c;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}.free svg{width:15px;height:15px}
.badge.fb{top:auto;bottom:12px;background:#2f9e55}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;padding:8px}

/* Netlify "Powered by" badge (bottom-right, ~56px tall) cannot be hidden on the free plan: lift bottom UI above it */
html.nlb{--nlb:60px}
html.nlb body{padding-bottom:calc(84px + var(--nlb) + env(safe-area-inset-bottom,0px))}
html.nlb .tabs{padding-bottom:calc(8px + var(--nlb) + env(safe-area-inset-bottom,0px))}
html.nlb .toast{bottom:calc(24px + var(--nlb) + env(safe-area-inset-bottom,0px))}
html.nlb .bn{bottom:calc(12px + var(--nlb) + env(safe-area-inset-bottom,0px))}
html.nlb .stick{bottom:calc(10px + 84px + var(--nlb) + env(safe-area-inset-bottom,0px))}
.vf{display:inline-flex;align-items:center;gap:4px;margin-top:2px;background:#e6f0ff;color:#1a5fd0;border-radius:999px;padding:2px 9px 2px 4px;font:700 12px Manrope,system-ui,sans-serif;white-space:nowrap}.vf svg{width:16px;height:16px}.bt{display:grid;justify-items:start;line-height:1.15}
</style>

<script>

async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{"Content-Type":"application/json","X-Admin-Code":adm.get(),...(opt.headers||{})}});let d=null;try{d=await r.json()}catch(e){}
 if(r.status===401&&path!=="/api/admin"){adm.set("");toast("Tu acceso de Admin expiró. Escribe el código otra vez.");location.hash="#acceso";throw new Error("auth")}
 if(!r.ok)throw new Error(d&&d.error||"No se pudo guardar. Inténtalo de nuevo.");return d}
async function loadItems(){try{const r=await fetch("/api/products",{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();if(Array.isArray(d)){items=d;route()}}catch(e){}}
const money=n=>"C$ "+Number(n).toLocaleString("es-NI",{maximumFractionDigits:2});
const waLink=p=>"https://wa.me/"+WA+"?text="+encodeURIComponent(p?`Hola JR_tienda, quiero más información sobre este producto: ${p.name} (${money(p.price)}${p.free?", envío gratis":""}).`:"Hola JR_tienda, quiero más información sobre sus productos.");
const waOrder=(rows,tot)=>"https://wa.me/"+WA+"?text="+encodeURIComponent("Hola JR_tienda, quiero más información sobre estos productos:\n"+rows.map(r=>`• ${r.q} x ${r.p.name} (${money(r.p.price)})`).join("\n")+`\nTotal aproximado: ${money(tot)}`);
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("jr:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function contactWA(p){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><h3>Abriendo WhatsApp</h3><p class="hint">Escribirás al +505 7750 2463${p?` sobre <b>${esc(p.name)}</b>`:""}.</p><a class="btn wa" href="${waLink(p)}" target="_blank" rel="noopener" id="go">Abrir WhatsApp</a><button class="btn line" id="no">Cancelar</button></div>`;
  document.body.appendChild(m);
  m.querySelector("#go").onclick=()=>setTimeout(()=>m.remove(),300);m.querySelector("#no").onclick=()=>m.remove();m.querySelector("#go").focus();
}
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC={chat:svg('<path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5A8.5 8.5 0 1 1 21 11.5z"/>'),bag:svg('<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'),mail:svg('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>'),arr:svg('<path d="M5 12h14M13 6l6 6-6 6"/>')};
const waBtn=(p,cls="")=>`<a class="btn wa ${cls}" href="${waLink(p)}" target="_blank" rel="noopener">${IC.chat} Escribir por WhatsApp</a>`;
let filt={c:"",s:"feat",q:""};
Object.assign(IC,{home:svg('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'),tag:svg('<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1"/>'),cart:svg('<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/>'),edit:svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),search:svg('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'),truck:svg('<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.5"/><circle cx="17" cy="17.5" r="1.5"/>'),lock:svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>')});
const freeTag=p=>p.free?`<span class="free">${IC.truck} Envío gratis</span>`:"";
const acts=c=>(c?`<a class="act brand" href="#catalogo">${IC.bag}<span><b>Ver catálogo</b><small>Todo lo que tenemos disponible hoy</small></span></a>`:"")+`<a class="act green" href="${waLink(null)}" target="_blank" rel="noopener">${IC.chat}<span><b>Escríbenos por WhatsApp</b><small>+505 7750 2463</small></span></a><a class="act" href="mailto:${MAIL}">${IC.mail}<span><b>Envíanos un correo</b><small>${MAIL}</small></span></a>`;
function card(p){const off=p.old&&+p.old>p.price;return`<article class="pc"><a class="pi" href="#p/${p.id}"><img src="${p.img}" alt="${esc(p.name)}" loading="lazy">${p.feat?`<span class="badge">Destacado</span>`:""}</a><div class="pb"><span class="cat">${esc(p.cat||"")}</span><h3><a href="#p/${p.id}">${esc(p.name)}</a></h3><div class="pp"><b>${money(p.price)}</b>${off?`<s>${money(p.old)}</s>`:""}</div>${freeTag(p)}<div class="pa"><button class="btn dark" data-cart="${p.id}">Agregar</button><a class="btn wa" href="${waLink(p)}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">${IC.chat}</a></div></div></article>`}
let cart=ls.get("jr_cart",{});
const saveCart=()=>ls.set("jr_cart",cart),cartN=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function addCart(id){cart[id]=(cart[id]||0)+1;saveCart();nav();toast("Añadido al carrito")}
function vCarrito(){
 const rows=Object.keys(cart).filter(id=>items.some(p=>p.id===id)).map(id=>({p:items.find(p=>p.id===id),q:cart[id]}));
 if(!rows.length){app.innerHTML=`<div class="empty"><h3>Tu carrito está vacío</h3><p class="hint">Elige productos del catálogo y envíanos tu pedido por WhatsApp.</p><a class="btn main" href="#catalogo">Ver catálogo</a></div>`;return}
 const tot=rows.reduce((a,r)=>a+r.p.price*r.q,0);
 const wm=waOrder(rows,tot).split("text=")[1],msg=decodeURIComponent(wm);
 app.innerHTML=`<div class="sec"><div><h2>Tu carrito</h2><p>Revisa tu pedido y envíalo por WhatsApp.</p></div></div><div class="rows">${rows.map(r=>`<div class="row"><img src="${r.p.img}" alt=""><div class="t"><b>${esc(r.p.name)}</b>${money(r.p.price)}${r.p.free?" · Envío gratis":""}</div><button class="btn line sm" data-q="${r.p.id}:-1" aria-label="Quitar uno">−</button><b>${r.q}</b><button class="btn line sm" data-q="${r.p.id}:1" aria-label="Añadir uno">+</button><button class="btn danger sm" data-q="${r.p.id}:0">Quitar</button></div>`).join("")}</div><div class="panel" style="max-width:none"><div class="price">Total: ${money(tot)}</div><a class="btn wa" id="send" data-msg="${esc(msg)}" href="${waOrder(rows,tot)}" target="_blank" rel="noopener">${IC.chat} Enviar pedido por WhatsApp</a><button class="btn out" id="cp" data-msg="${esc(msg)}">Copiar pedido</button><a class="hint" style="text-align:center" href="whatsapp://send?phone=${WA}&text=${wm}">¿No se abre? Probar con la app de WhatsApp</a></div>`;
}
function nav(){
  const h=(location.hash.slice(1).split("/")[0])||"inicio",A=(k,t,x="")=>`<a href="#${k}" class="${h===k?"on":""}">${t}${x}</a>`;
  const T=(k,t,ic,x="")=>`<a href="#${k}" class="${h===k?"on":""}">${ic}<span>${t}</span>${x}</a>`;
  $("#nav").innerHTML=T("inicio","Inicio",IC.home)+T("catalogo","Catálogo",IC.tag)+T("carrito","Carrito",IC.cart,cartN()?`<i>${cartN()}</i>`:"")+T("contacto","Contacto",IC.chat)+(logged()?T("gestion","Admin",IC.edit):T("acceso","Admin",IC.lock));
  $("#ttl").textContent=({catalogo:"Catálogo",carrito:"Tu carrito",contacto:"Contacto",gestion:"Admin",producto:"Admin",p:"Producto",acceso:"Admin"})[h]||"JR_tienda";
  $("#chat").href=waLink(null);
  $("#foot").innerHTML=`© JR_tienda<br><button id="inst" class="lnk">Instalar app</button>`;
  const i=$("#inst");if(i)i.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;nav()}else{const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><h3>Instalar JR_tienda</h3><p class="hint"><b>Android (Chrome):</b> menú ⋮ y luego “Instalar app” o “Añadir a pantalla de inicio”.<br><b>iPhone (Safari):</b> botón Compartir y luego “Añadir a pantalla de inicio”.</p><button class="btn main" id="ok">Entendido</button></div>`;document.body.appendChild(m);m.querySelector("#ok").onclick=()=>m.remove()}};
  const o=$("#out");if(o)o.onclick=()=>{adm.set("");toast("Saliste de Admin");location.hash="#inicio"};
}
function vInicio(){
  app.innerHTML=`<section class="hero"><h1>Encuentra lo que <i>necesitas</i> en un solo lugar.</h1><p>Mira cada producto con su foto y su precio. Si algo te gusta, escríbenos por WhatsApp o arma tu pedido en el carrito.</p><div class="cta"><a class="btn dark" href="#catalogo">Ver catálogo ${IC.arr}</a><a class="btn out" href="${waLink(null)}" target="_blank" rel="noopener">${IC.chat} +505 7750 2463</a></div><div class="trust"><span>${IC.chat} Atención directa por WhatsApp</span></div></section>`;
}
function vContacto(){app.innerHTML=`<h2 class="ct">Contacto</h2><p class="hint" style="margin:0 0 16px">Escríbenos y te respondemos directo.</p><div class="acts">${acts(false)}</div>`}
function vCatalogo(){
  const cats=[...new Set(items.map(p=>p.cat).filter(Boolean))];
  app.innerHTML=(items.length?`<label class="srch">${IC.search}<input type="search" id="q" placeholder="Buscar productos…" value="${esc(filt.q)}" autocomplete="off"></label>`+(cats.length?`<div class="chips">${["",...cats].map(c=>`<button class="chip ${filt.c===c?"on":""}" data-c="${esc(c)}">${esc(c||"Todos")}</button>`).join("")}</div>`:"")+`<div class="grid" id="gr"></div>`:`<div class="empty"><h3>Estamos preparando el catálogo</h3><p class="hint">Mientras tanto, escríbenos y te mostramos lo disponible.</p>${waBtn(null)}</div>`);
  const draw=()=>{const q=filt.q.trim().toLowerCase(),l=items.filter(p=>(!filt.c||p.cat===filt.c)&&(!q||(p.name+" "+(p.specs||"")).toLowerCase().includes(q))).sort((a,b)=>(b.feat?1:0)-(a.feat?1:0)||items.indexOf(b)-items.indexOf(a)),g=$("#gr");if(g)g.innerHTML=l.length?l.map(card).join(""):`<p class="hint" style="grid-column:1/-1">No encontramos productos con esa búsqueda.</p>`};
  draw();const i=$("#q");if(i)i.oninput=()=>{filt.q=i.value;draw()};
}
function vDetalle(id){
  const p=items.find(x=>x.id===id);
  if(!p){app.innerHTML=`<div class="empty"><h3>Este producto ya no está disponible</h3><a class="btn main" href="#catalogo">Volver al catálogo</a></div>`;return}
  const off=p.old&&+p.old>p.price;
  app.innerHTML=`<p><a href="#catalogo">← Catálogo</a></p><div class="detail"><img src="${p.img}" alt="${esc(p.name)}"><div style="display:grid;gap:14px"><span class="cat">${esc(p.cat||"")}</span><h1>${esc(p.name)}</h1><div><b class="price" style="font-size:32px">${money(p.price)}</b>${off?` <s style="color:var(--mute)">${money(p.old)}</s>`:""}</div>${p.free?`<span class="free" style="font-size:14px;padding:6px 12px">${IC.truck} Incluye envío gratis</span>`:""}<h3 style="font-size:16px;font-family:Manrope,sans-serif;font-weight:700">Especificaciones</h3><div class="specs">${esc(p.specs)}</div><div class="stick" style="gap:10px"><button class="btn dark" data-cart="${p.id}">Agregar al carrito</button>${waBtn(p)}</div></div></div>`;
}
function vAcceso(){
  if(logged()){location.hash="#gestion";return}
  app.innerHTML=`<form class="panel" id="f" novalidate><h2>Admin</h2><p class="hint">Escribe el código de administrador para agregar y editar productos del catálogo.</p>
  <label>Código de acceso<input type="password" id="pw" autocomplete="current-password" autocapitalize="characters" spellcheck="false"></label>
  <div class="err" id="er" role="alert"></div><button class="btn main" type="submit" id="go">Entrar</button></form>`;
  $("#pw").focus();
  $("#f").onsubmit=async e=>{e.preventDefault();const c=$("#pw").value.trim(),er=$("#er"),b=$("#go");er.textContent="";
    if(!c){er.textContent="Escribe el código.";return}
    b.disabled=true;b.textContent="Verificando…";
    try{const r=await fetch("/api/admin",{method:"POST",headers:{"X-Admin-Code":c}});
      if(r.ok){adm.set(c);toast("Bienvenido a Admin");location.hash="#gestion";return}
      er.textContent=r.status===401?"Código incorrecto. Inténtalo de nuevo.":"No se pudo verificar. Revisa tu conexión."}
    catch(x){er.textContent="No se pudo verificar. Revisa tu conexión."}
    b.disabled=false;b.textContent="Entrar"};
}
function vGestion(){
  app.innerHTML=`<div class="sec"><div><h2>Gestión de productos</h2><p>Lo que guardes aparece de inmediato en el catálogo público.</p></div><div class="bar"><a class="btn main" href="#producto/nuevo">Añadir producto</a><button class="btn line" id="out">Salir</button></div></div>`+
  (items.length?`<div class="rows">${[...items].reverse().map(p=>`<div class="row"><img src="${p.img}" alt=""><div class="t"><b>${esc(p.name)}</b>${money(p.price)}${p.free?" · Envío gratis":""}</div><a class="btn line sm" href="#p/${p.id}">Ver</a><a class="btn line sm" href="#producto/${p.id}">Editar</a><button class="btn danger sm" data-del="${p.id}">Retirar</button></div>`).join("")}</div>`:`<div class="empty"><h3>Aún no hay productos</h3><p class="hint">Añade el primero con su foto, nombre, especificaciones y valor.</p><a class="btn main" href="#producto/nuevo">Añadir producto</a></div>`);
}
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.84))};i.src=r.result};r.readAsDataURL(file)})}
function vForm(id){
  const ed=items.find(x=>x.id===id);
  if(!draft||draft.id!==(ed?ed.id:"nuevo"))draft=ed?{...ed}:{id:"nuevo",img:"",name:"",specs:"",price:"",cat:"",old:"",feat:false,free:false};
  app.innerHTML=`<form class="panel" id="f" novalidate style="max-width:640px"><h2>${ed?"Editar producto":"Añadir producto"}</h2>
  <label>Foto del producto<div class="drop" id="dp" tabindex="0" role="button">${draft.img?`<img src="${draft.img}" alt="Foto elegida">`:`<span><b>Toca para elegir tu foto</b><br><span class="hint">Usa una foto real del artículo</span></span>`}</div></label>
  <input type="file" id="fi" accept="image/*" hidden><div class="err" id="e-img"></div>
  <label>Nombre del producto<input type="text" id="nm" value="${esc(draft.name)}" maxlength="120"></label><div class="err" id="e-nm"></div>
  <label>Especificaciones<textarea id="sp" maxlength="1000" placeholder="Material, tamaño, color, detalles…">${esc(draft.specs)}</textarea></label><div class="err" id="e-sp"></div>
  <label>Precio (C$)<input type="number" id="pr" inputmode="decimal" min="0" step="any" value="${esc(draft.price)}"></label><div class="err" id="e-pr"></div>
  <label>Categoría (opcional)<input type="text" id="ca" maxlength="40" value="${esc(draft.cat||"")}" placeholder="Ej: Audio, Belleza…"></label>
  <label>Precio anterior en C$ (opcional)<input type="number" id="ol" inputmode="decimal" min="0" step="any" value="${esc(draft.old||"")}"></label>
  <label style="display:flex;gap:10px;align-items:center;font-size:16px"><input type="checkbox" id="fr" ${draft.free?"checked":""} style="width:22px;height:22px"> Incluye envío gratis</label>
  <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="ft" ${draft.feat?"checked":""}> Mostrar como Destacado</label>
  <div class="bar"><button class="btn main" type="submit">Aceptar y publicar</button><a class="btn line" href="#gestion">Cancelar</a></div></form>`;
  const fi=$("#fi");$("#dp").onclick=()=>fi.click();$("#dp").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click()}};
  fi.onchange=async()=>{const f=fi.files[0];if(!f)return;draft.name=$("#nm").value;draft.specs=$("#sp").value;draft.price=$("#pr").value;draft.cat=$("#ca").value;draft.old=$("#ol").value;draft.feat=$("#ft").checked;draft.free=$("#fr").checked;
    try{draft.img=await shrink(f);route()}catch(e){$("#e-img").textContent="No pudimos leer esa foto. Prueba con otra."}};
  $("#f").onsubmit=async e=>{e.preventDefault();const v={name:$("#nm").value.trim(),specs:$("#sp").value.trim(),price:$("#pr").value};let bad=0;
    const E=(k,m)=>{$("#e-"+k).textContent=m;bad=1};["img","nm","sp","pr"].forEach(k=>$("#e-"+k).textContent="");
    if(!draft.img)E("img","Falta la foto del producto.");if(!v.name)E("nm","Escribe el nombre del producto.");if(!v.specs)E("sp","Añade las especificaciones.");
    if(v.price===""||isNaN(+v.price)||+v.price<0)E("pr","Escribe un valor válido, solo números.");if(bad)return;
    const body={img:draft.img,name:v.name,specs:v.specs,price:+v.price,cat:$("#ca").value.trim(),old:($("#ol").value===""||isNaN(+$("#ol").value))?"":+$("#ol").value,feat:$("#ft").checked,free:$("#fr").checked};
    const sb=e.submitter||$("#f button[type=submit]");sb.disabled=true;sb.textContent="Publicando…";
    try{const p=await api(ed?"/api/products/"+encodeURIComponent(ed.id):"/api/products",{method:ed?"PUT":"POST",body:JSON.stringify(body)});
      items=ed?items.map(x=>x.id===p.id?p:x):[...items,p];draft=null;toast("Producto publicado. Ya lo ven todos.");location.hash="#gestion"}
    catch(x){if(x.message!=="auth"){toast(x.message);sb.disabled=false;sb.textContent="Aceptar y publicar"}}};
}
function route(){
  const h=location.hash.slice(1)||"inicio",[r,a]=h.split("/");window.scrollTo(0,0);
  const prot=["gestion","producto"].includes(r);
  if(prot&&!logged()){location.hash="#acceso";return}
  ({inicio:vInicio,catalogo:vCatalogo,carrito:vCarrito,contacto:vContacto,p:()=>vDetalle(a),acceso:vAcceso,gestion:vGestion,producto:()=>vForm(a)}[r]||vInicio)();nav();
}
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-c],[data-s]"),c=e.target.closest("[data-cart]"),q=e.target.closest("[data-q]"),w=e.target.closest("[data-wa]"),o=e.target.closest("[data-open]"),d=e.target.closest("[data-del]");
  const dm=e.target.closest("[data-msg]");if(dm){try{navigator.clipboard.writeText(dm.dataset.msg).then(()=>toast("Pedido copiado. Si WhatsApp no se abre, pega el mensaje en el chat de +505 7750 2463"),()=>{})}catch(x){}if(dm.id==="cp")return}
  if(f){if(f.hasAttribute("data-c"))filt.c=f.dataset.c;else filt.s=f.dataset.s;route();return}
  if(c){addCart(c.dataset.cart);return}
  if(q){const[i,n]=q.dataset.q.split(":");cart[i]=n==="0"?0:(cart[i]||0)+ +n;if(cart[i]<=0)delete cart[i];saveCart();nav();route();return}
  if(w)contactWA(items.find(x=>x.id===w.dataset.wa));
  else if(o)location.hash="#p/"+o.dataset.open;
  else if(d&&logged()){const p=items.find(x=>x.id===d.dataset.del);const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><h3>¿Retirar este producto?</h3><p class="hint">“${esc(p.name)}” dejará de aparecer en el catálogo público.</p><button class="btn danger" id="y">Sí, retirar</button><button class="btn line" id="n">Cancelar</button></div>`;
    document.body.appendChild(m);m.querySelector("#n").onclick=()=>m.remove();
    m.querySelector("#y").onclick=async()=>{m.remove();try{await api("/api/products/"+encodeURIComponent(p.id),{method:"DELETE"});items=items.filter(x=>x.id!==p.id);toast("Producto retirado del catálogo.");route()}catch(x){if(x.message!=="auth")toast(x.message)}}}
});
addEventListener("hashchange",route);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;nav()});
function banner(){
 try{if(localStorage.getItem("jr_no")||matchMedia("(display-mode: standalone)").matches||navigator.standalone||$("#bn"))return}catch(e){}
 const b=document.createElement("div");b.id="bn";b.className="bn";
 b.innerHTML=`<span class="logo">JR</span><div><b>Instala JR_tienda</b><div class="hint">Añádela a tu pantalla de inicio como una app.</div></div><button class="btn main sm" id="bi">Instalar</button><button class="btn line sm" id="bx" aria-label="Cerrar">✕</button>`;
 document.body.appendChild(b);
 $("#bi").onclick=()=>{b.remove();$("#inst").click()};
 $("#bx").onclick=()=>{b.remove();try{localStorage.setItem("jr_no","1")}catch(e){}};
}
setTimeout(banner,1200);
document.head.insertAdjacentHTML("beforeend",'<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">');
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
route();loadItems();
try{const f=sessionStorage.getItem("jr_flash");if(f){sessionStorage.removeItem("jr_flash");setTimeout(()=>toast(f),400)}}catch(e){}
</script>
